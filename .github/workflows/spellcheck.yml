name: spellcheck
on:
  workflow_dispatch:
jobs:
  check-spelling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Spelling
        uses: rojopolis/spellcheck-github-actions@0.40.0
        with:
          config_path: .github/spellcheck-settings.yml
          task_name: Markdown
