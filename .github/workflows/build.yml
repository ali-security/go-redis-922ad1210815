name: Go

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional go test -run selector; empty runs the full suite"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUN_MONITOR_TEST: "true"
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.19.x, 1.20.x, 1.21.x]

    services:
      redis:
        image: redis/redis-stack-server:7.4.0-v1
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Set up ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build module zip
        if: matrix.go-version == '1.21.x'
        run: |
          set -euo pipefail
          HELPER="$RUNNER_TEMP/ziphelper"
          mkdir -p "$HELPER" "$RUNNER_TEMP/modsrc" "$RUNNER_TEMP/dist"
          cat > "$HELPER/main.go" <<'EOF'
          package main

          import (
              "log"
              "os"

              "golang.org/x/mod/module"
              "golang.org/x/mod/zip"
          )

          func main() {
              f, err := os.Create(os.Args[3])
              if err != nil {
                  log.Fatal(err)
              }
              defer f.Close()
              mv := module.Version{Path: os.Args[1], Version: os.Args[2]}
              if err := zip.CreateFromDir(f, mv, os.Args[4]); err != nil {
                  log.Fatal(err)
              }
          }
          EOF
          (cd "$HELPER" && go mod init ziphelper && go get golang.org/x/mod@v0.17.0 && go build -o "$RUNNER_TEMP/ziphelper-bin" .)
          cp -r "$GITHUB_WORKSPACE/." "$RUNNER_TEMP/modsrc/"
          "$RUNNER_TEMP/ziphelper-bin" github.com/redis/go-redis/v9 v9.7.0 "$RUNNER_TEMP/dist/v9.7.0.zip" "$RUNNER_TEMP/modsrc"
          unzip -l "$RUNNER_TEMP/dist/v9.7.0.zip" | tail -1

      - name: Upload module zip
        if: matrix.go-version == '1.21.x'
        uses: actions/upload-artifact@v4
        with:
          name: go-module-zip
          path: ${{ runner.temp }}/dist/v9.7.0.zip
          if-no-files-found: error

      - name: Ginkgo skipped-spec report
        if: inputs.test-filter == ''
        run: |
          set -euo pipefail
          make testdeps > "$RUNNER_TEMP/testdeps.log" 2>&1
          go test -count=1 -run TestGinkgoSuite -ginkgo.json-report="$RUNNER_TEMP/ginkgo.json" .
          jq -r '[.[] | .SpecReports[] | select(.LeafNodeType == "It")] as $s
            | "GINKGO RESULTS: passed=\($s | map(select(.State == "passed")) | length) failed=\($s | map(select(.State == "failed")) | length) skipped=\($s | map(select(.State == "skipped")) | length) pending=\($s | map(select(.State == "pending")) | length) || NOT-RUN SPECS WITH REASONS: "
              + ($s | map(select(.State == "skipped" or .State == "pending"))
                 | map("[\(.State)] \((.ContainerHierarchyTexts // []) | join(" > ")) > \(.LeafNodeText) (\(.LeafNodeLocation.FileName | split("/") | last):\(.LeafNodeLocation.LineNumber)) reason=\(if .State == "pending" then "PIt pending spec declared upstream" else ((.Failure.Message // "") | gsub("\n"; " ")) end)")
                 | join(" ;; "))' "$RUNNER_TEMP/ginkgo.json"

      - name: Test
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            make testdeps
            go test -v -count=1 -run '${{ inputs.test-filter }}' ./...
          else
            make test
          fi

  build-macos:
    name: build (macos)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      RUN_MONITOR_TEST: "true"

    steps:
      - name: Set up Go 1.23.x
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start redis-stack-server
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/redis-stack"
          cd "$RUNNER_TEMP/redis-stack"
          curl -fsSL -o redis-stack.zip https://packages.redis.io/redis-stack/redis-stack-server-7.4.0-v1.monterey.arm64.zip
          unzip -q redis-stack.zip
          BIN=$(find "$RUNNER_TEMP/redis-stack" -type f -path '*bin/redis-stack-server' | head -1)
          echo "redis-stack-server at $BIN"
          "$BIN" --daemonize yes
          for i in $(seq 1 30); do
            if "$(dirname "$BIN")/redis-cli" -p 6379 ping 2>/dev/null | grep -q PONG; then echo "redis-stack up"; exit 0; fi
            sleep 1
          done
          echo "redis-stack-server did not start"; exit 1

      - name: Build test redis
        run: make testdeps > "$RUNNER_TEMP/testdeps.log" 2>&1 || (tail -100 "$RUNNER_TEMP/testdeps.log"; exit 1)

      - name: Test
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.test-filter }}" ]; then
            go test -v -count=1 -run '${{ inputs.test-filter }}' ./...
          else
            go test -v -count=1 -ginkgo.json-report="$RUNNER_TEMP/ginkgo.json" .
            jq -r '[.[] | .SpecReports[] | select(.LeafNodeType == "It")] as $s
              | "GINKGO RESULTS (macos): passed=\($s | map(select(.State == "passed")) | length) failed=\($s | map(select(.State == "failed")) | length) skipped=\($s | map(select(.State == "skipped")) | length) pending=\($s | map(select(.State == "pending")) | length) || NOT-RUN SPECS WITH REASONS: "
                + ($s | map(select(.State == "skipped" or .State == "pending"))
                   | map("[\(.State)] \((.ContainerHierarchyTexts // []) | join(" > ")) > \(.LeafNodeText) (\(.LeafNodeLocation.FileName | split("/") | last):\(.LeafNodeLocation.LineNumber)) reason=\(if .State == "pending" then "PIt pending spec declared upstream" else ((.Failure.Message // "") | gsub("\n"; " ")) end)")
                   | join(" ;; "))' "$RUNNER_TEMP/ginkgo.json"
            go test -v ./... -short -race
          fi
